<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">BBW Stage 1 traffic and deployment flow</title>
  <desc id="desc">Two diagrams showing user traffic through DNS, CloudFront, WAF, ALB and private ECS services, and deployment through GitHub Actions OIDC, CDK, CloudFormation, ECS stabilization and rollback.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 28px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}.lane{fill:#eef2ff;stroke:#c7d2fe;stroke-width:2}.box{fill:#fff;stroke:#475569;stroke-width:2;rx:12}.edge{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.service{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.data{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}.deploy{fill:#fefce8;stroke:#ca8a04;stroke-width:2;rx:12}.fail{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:12}.label{font:600 15px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:400 12px Arial,sans-serif;fill:#475569;text-anchor:middle}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.section{font:700 22px Arial,sans-serif;fill:#1e3a8a}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1120"/>
  <text class="title" x="70" y="58">BBW Stage 1 — current infrastructure flow</text>
  <text class="subtitle" x="70" y="86">Traffic path and deployment/recovery path for the single Stage 1 AWS environment</text>

  <rect class="lane" x="50" y="120" width="1500" height="440" rx="18"/>
  <text class="section" x="80" y="160">A. User traffic</text>

  <rect class="box" x="80" y="215" width="170" height="70"/><text class="label" x="165" y="245">Browser / API client</text><text class="small" x="165" y="266">HTTPS request</text>
  <rect class="box" x="300" y="215" width="180" height="70"/><text class="label" x="390" y="245">Owner DNS</text><text class="small" x="390" y="266">CNAME records</text>
  <rect class="edge" x="530" y="185" width="230" height="70"/><text class="label" x="645" y="215">CloudFront + WAF</text><text class="small" x="645" y="236">public/member surface</text>
  <rect class="edge" x="530" y="285" width="230" height="70"/><text class="label" x="645" y="315">CloudFront + WAF</text><text class="small" x="645" y="336">management surface</text>
  <rect class="edge" x="810" y="235" width="230" height="90"/><text class="label" x="925" y="268">HTTPS ALB + WAF</text><text class="small" x="925" y="289">bbw-stage1-edge</text><text class="small" x="925" y="307">host-based routing</text>
  <rect class="service" x="1100" y="175" width="185" height="70"/><text class="label" x="1192" y="205">Public/member ECS</text><text class="small" x="1192" y="226">private Fargate task</text>
  <rect class="service" x="1100" y="270" width="185" height="70"/><text class="label" x="1192" y="300">Management ECS</text><text class="small" x="1192" y="321">private Fargate task</text>
  <rect class="service" x="1100" y="365" width="185" height="70"/><text class="label" x="1192" y="395">API ECS</text><text class="small" x="1192" y="416">Fastify /readyz</text>
  <rect class="service" x="1100" y="460" width="185" height="70"/><text class="label" x="1192" y="490">Worker ECS</text><text class="small" x="1192" y="511">SQS consumer</text>
  <rect class="data" x="1330" y="270" width="170" height="70"/><text class="label" x="1415" y="300">RDS PostgreSQL</text><text class="small" x="1415" y="321">private + TLS</text>
  <rect class="data" x="1330" y="385" width="170" height="70"/><text class="label" x="1415" y="415">SQS / DLQ</text><text class="small" x="1415" y="436">retry + drain</text>
  <rect class="data" x="1330" y="480" width="170" height="70"/><text class="label" x="1415" y="510">SES / events</text><text class="small" x="1415" y="531">email + feedback</text>

  <path class="arrow" d="M250 250 H300"/><path class="arrow" d="M480 250 H530"/><path class="arrow" d="M760 220 H810"/><path class="arrow" d="M760 320 H810"/>
  <path class="arrow" d="M1040 260 H1100"/><path class="arrow" d="M1040 285 H1080 V305 H1100"/><path class="arrow" d="M1040 305 H1070 V400 H1100"/>
  <path class="arrow" d="M1285 400 H1330"/><path class="arrow" d="M1192 435 V495 H1330"/><path class="arrow" d="M1285 495 H1310 V515 H1330"/>
  <text class="small" x="645" y="175">app.bbw.incendiollc.com</text><text class="small" x="645" y="375">admin.bbw.incendiollc.com</text><text class="small" x="925" y="350">bbw / app → public · admin → management · api → API · unknown → 404</text>

  <rect class="lane" x="50" y="600" width="1500" height="460" rx="18"/>
  <text class="section" x="80" y="640">B. Deployment and recovery</text>
  <rect class="box" x="80" y="700" width="175" height="70"/><text class="label" x="167" y="730">Git push / dispatch</text><text class="small" x="167" y="751">main or manual run</text>
  <rect class="deploy" x="305" y="700" width="190" height="70"/><text class="label" x="400" y="730">GitHub Actions</text><text class="small" x="400" y="751">tests + security gates</text>
  <rect class="deploy" x="545" y="700" width="190" height="70"/><text class="label" x="640" y="730">OIDC role</text><text class="small" x="640" y="751">BbwGithubActionsDeploy</text>
  <rect class="deploy" x="785" y="700" width="190" height="70"/><text class="label" x="880" y="730">CDK synth / ECR</text><text class="small" x="880" y="751">immutable build inputs</text>
  <rect class="deploy" x="1025" y="700" width="220" height="70"/><text class="label" x="1135" y="730">CloudFormation</text><text class="small" x="1135" y="751">BbwStage1-stage1</text>
  <rect class="deploy" x="1295" y="700" width="205" height="70"/><text class="label" x="1397" y="730">ECS deployment</text><text class="small" x="1397" y="751">capture + update tasks</text>
  <path class="arrow" d="M255 735 H305"/><path class="arrow" d="M495 735 H545"/><path class="arrow" d="M735 735 H785"/><path class="arrow" d="M975 735 H1025"/><path class="arrow" d="M1245 735 H1295"/>

  <rect class="box" x="405" y="845" width="210" height="70"/><text class="label" x="510" y="875">Wait for stability</text><text class="small" x="510" y="896">four ECS services</text>
  <rect class="box" x="695" y="845" width="210" height="70"/><text class="label" x="800" y="875">Smoke tests</text><text class="small" x="800" y="896">host isolation + HTTPS</text>
  <rect class="service" x="985" y="845" width="210" height="70"/><text class="label" x="1090" y="875">Success</text><text class="small" x="1090" y="896">deployment recorded</text>
  <rect class="fail" x="1265" y="845" width="210" height="70"/><text class="label" x="1370" y="875">Failure path</text><text class="small" x="1370" y="896">circuit breaker / restore</text>
  <path class="arrow" d="M1397 770 V810 H510 V845"/><path class="arrow" d="M615 880 H695"/><path class="arrow" d="M905 880 H985"/><path class="arrow dashed" d="M800 915 V970 H1370 V915"/>
  <path class="arrow" d="M1295 880 H1240 V1010 H510 V915"/>
  <text class="small" x="1080" y="1005">restore previously captured task definitions, then wait for stable services</text>
  <text class="subtitle" x="80" y="1035">Promotion workflow separately verifies the successful source run and immutable commit, then runs a non-mutating Stage 1 dry run; real production promotion is approval-gated and currently fail-closed.</text>
</svg>
