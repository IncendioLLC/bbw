</style></head><body><main><div class="meta"><div><h1>BBW Stage 1 progress</h1><p>Milestones and tasks from the execution harness</p></div><p>Last refreshed: 2026-09-27</p></div><section class="overview" aria-label="Task overview"><div class="card complete"><div class="label">Complete</div><div class="value" id="complete">0</div></div><div class="card pending"><div class="label">Pending</div><div class="value" id="pending">0</div></div><div class="card ready"><div class="label">Ready</div><div class="value" id="ready">0</div></div><div class="card blocked"><div class="label">Blocked</div><div class="value" id="blocked">0</div></div></section><div class="progress" role="progressbar" aria-label="Overall completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressFill" style="width:0%"></span></div><div id="app"></div></main><script id="embeddedTasks" type="application/json">[{"id":"FND-001","title":"Initialize the pnpm monorepo","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"root workspace manifests","deliverable":"Node 24, pnpm, and Turborepo manifests with reproducible dependency installation.","tests":["Run `corepack pnpm install --frozen-lockfile` from a clean checkout."],"evidence":"Node 24.21.0 and pnpm 12.6.0 are pinned; a clean temporary workspace completed the frozen-lockfile install and ran Turborepo 2.11.4."},{"id":"FND-002","title":"Create application and package directory skeleton","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"`apps/`, `packages/`, `infra/`","deliverable":"Empty public web, admin web, API, worker, shared-package, and infrastructure workspaces.","tests":["Run `pnpm -r list --depth -1` and confirm every intended workspace is discovered."],"evidence":"`pnpm -r list --depth -1` discovered the root plus all ten intended public, admin, API, worker, shared-package, and infrastructure workspaces."},{"id":"FND-003","title":"Add shared TypeScript configuration","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"root and package TypeScript configs","deliverable":"Strict base, browser, Node, and test TypeScript configurations.","tests":["Compile a minimal browser package and Node package with `tsc --noEmit`."],"evidence":"Strict base/browser/Node/test configurations compile the minimal browser and Node fixtures with TypeScript 6.0.3 and Node 24 types."},{"id":"FND-004","title":"Configure linting and formatting checks","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"root lint and format configuration","deliverable":"Repository-wide ESLint and formatting checks that do not mutate files in CI.","tests":["Run `pnpm lint` and `pnpm format:check`, then confirm an intentional violation fails."],"evidence":"`pnpm lint` and `pnpm format:check` pass; an intentional unused TypeScript variable is rejected by ESLint with a nonzero exit."},{"id":"FND-005","title":"Configure unit-test infrastructure","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"test configuration and shared test utilities","deliverable":"Vitest projects for browser, Node, and shared packages with coverage output.","tests":["Run one passing test per project and confirm one intentional failure is reported."],"evidence":"Browser, Node, and shared Vitest projects each pass; combined V8 coverage is 100% for the current support fixture, and an intentional failure returned nonzero."},{"id":"FND-006","title":"Configure Playwright infrastructure","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"end-to-end test configuration","deliverable":"Browser projects for Chromium, Firefox, WebKit, and mobile viewports.","tests":["Run a placeholder smoke page in all configured browser projects."],"evidence":"The smoke flow passed in Chromium, Firefox, WebKit, Pixel 7 Chromium, and iPhone 15 WebKit projects; configuration typecheck and formatting passed."},{"id":"FND-007","title":"Configure Turborepo task pipelines","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"root task orchestration","deliverable":"Dependency-aware build, lint, typecheck, unit, integration, and e2e pipelines.","tests":["Run `pnpm turbo run lint typecheck test` and inspect dependency ordering."],"evidence":"`pnpm turbo run lint typecheck test` completed 40 ordered tasks; the second run reused 36 cached tasks, and the dry plan confirms package tests depend on package builds."},{"id":"FND-008","title":"Add environment-variable schema package","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"shared configuration package","deliverable":"Typed Zod schemas for each deployable with secret-safe error messages.","tests":["Unit-test valid, missing, malformed, and secret-redaction cases."],"evidence":"Twelve Zod tests cover valid, missing, malformed, and secret-redacted web/admin/API/worker/infra configurations; package typecheck passes."},{"id":"FND-009","title":"Add local development service definitions","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"local Docker Compose and example environment files","deliverable":"Local PostgreSQL/pgvector, mail capture, and required emulators without committed secrets.","tests":["Start services, pass health checks, and stop them cleanly from documented commands."],"evidence":"Two live start/health/stop cycles passed for loopback-only PostgreSQL 17/pgvector 0.8.6, Mailpit, and LocalStack; database extension and emulator API probes passed, and no BBW containers or network remained after shutdown."},{"id":"FND-010","title":"Add secret and dependency scanning","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"repository security configuration","deliverable":"Automated secret scanning, lockfile audit, and prohibited-file checks.","tests":["Confirm safe repository passes and synthetic secret fixture is rejected."],"evidence":"Repository secret/prohibited-file scans and high-severity pnpm audit passed; a synthetic AWS credential was rejected and removed."},{"id":"FND-011","title":"Create pull-request quality workflow","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"GitHub Actions validation workflow","deliverable":"Cached install, lint, typecheck, unit tests, build, and security checks on pull requests.","tests":["Validate workflow syntax and run all referenced commands locally."],"evidence":"GitHub Actions YAML parsed successfully; its frozen install, security, license, formatting, lint, typecheck, unit, build, and five-project Playwright commands all passed locally."},{"id":"FND-012","title":"Add architecture decision record template","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"engineering documentation","deliverable":"Compact ADR template recording context, decision, consequences, and supersession.","tests":["Render Markdown and verify all required fields are present."],"evidence":"`docs/adr/0000-template.md` was structurally verified to contain all required metadata plus Context, Decision, Consequences, and Supersession sections."},{"id":"FND-013","title":"Document local contributor workflow","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"root developer documentation","deliverable":"Setup, service startup, migrations, tests, troubleshooting, and demo-archive boundaries.","tests":["Follow instructions in a clean temporary checkout through the first passing test."],"evidence":"A clean isolated repository copy completed the documented frozen-lockfile install and all three first-run unit projects with 100% fixture coverage; documentation formatting and generated-output ignore behavior passed."},{"id":"FND-014","title":"Add license and generated-file policies","milestone":"Milestone 1 — Workspace and Engineering Foundation","status":"complete","deps":[],"area":"repository policy files","deliverable":"Dependency-license allowlist and generated-artifact ownership rules.","tests":["Run the license check and verify a disallowed synthetic license fails."],"evidence":"Installed dependency licenses passed the fail-closed allowlist; synthetic AGPL and unknown-exception fixtures failed as required, and generated-file ownership is documented."},{"id":"ARC-001","title":"Define domain identifiers and shared primitives","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"shared domain package","deliverable":"Branded IDs, timestamps, pagination, money, actor, and tenant primitives.","tests":["Type-test invalid identifier mixing and unit-test runtime parsers."],"evidence":"Branded organization/user/system IDs, ISO timestamps, pagination, money, actor, and tenant context are exported with runtime parsers; four Vitest cases and the dedicated TypeScript brand-mixing project pass."},{"id":"ARC-002","title":"Define standard API success and error envelopes","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"shared API contracts","deliverable":"Stable error codes, correlation IDs, field errors, and pagination envelopes.","tests":["Unit-test serialization and OpenAPI examples for each error class."],"evidence":"Shared success/failure envelopes, stable error codes, correlation IDs, field errors, pagination data, and OpenAPI examples are implemented; two focused serialization tests pass."},{"id":"ARC-003","title":"Scaffold the Fastify API service","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"API application","deliverable":"Bootable API with health, readiness, request ID, structured logging, and graceful shutdown.","tests":["Start API and integration-test health, readiness, request ID, and SIGTERM shutdown."],"evidence":"Fastify service exposes `/healthz` and `/readyz`, preserves or generates `x-request-id`, logs structured startup failures, and closes on SIGTERM; two integration tests plus package lint/typecheck pass."},{"id":"ARC-004","title":"Scaffold the public/member Next.js application","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"public/member application","deliverable":"App Router shell with public and authenticated route groups and health endpoint.","tests":["Build the app and Playwright-test public route and authenticated redirect behavior."],"evidence":"Next.js production build and TypeScript checks pass; three Chromium Playwright tests cover the public home page, unauthenticated member redirect, and no-store health endpoint."},{"id":"ARC-005","title":"Scaffold the management Next.js application","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"management application","deliverable":"Independently buildable admin shell with no public/member navigation.","tests":["Build separately and verify an unauthenticated admin route denies access."],"evidence":"Independent Next.js build and TypeScript checks pass; `/admin` returns a 307 redirect to `/sign-in?returnTo=%2Fadmin` without a verified management principal, and management navigation contains only `/admin` routes."},{"id":"ARC-006","title":"Scaffold the background worker","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"worker application","deliverable":"Worker lifecycle, health signal, structured logging, and graceful job shutdown.","tests":["Run a synthetic job and verify success, failure, and SIGTERM behavior."],"evidence":"Worker runtime tests pass for synthetic success, failure, health, graceful shutdown, and SIGTERM handling; package lint and typecheck pass."},{"id":"ARC-007","title":"Create shared HTTP client","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"typed client package","deliverable":"Server/browser-safe client with auth, correlation ID, timeout, and typed-error handling.","tests":["Contract-test success, validation error, unauthorized, timeout, and network failure."],"evidence":"Browser/server-safe client adds bearer auth and correlation IDs, enforces timeouts, parses typed envelopes, and maps validation, unauthorized, timeout, and network failures to `ApiClientError`; three contract tests, typecheck, and lint pass."},{"id":"ARC-008","title":"Generate and validate OpenAPI specification","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"API contracts and generated client inputs","deliverable":"Deterministic OpenAPI document generated from route schemas.","tests":["Generate twice, diff outputs, and run an OpenAPI validator."],"evidence":"`pnpm openapi:generate` produces a checked-in deterministic OpenAPI 3.1 document for health/readiness routes; two generate/check cycles and formatting validation pass, with generated-file ownership recorded."},{"id":"ARC-009","title":"Create design-token package","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"shared UI package","deliverable":"Accessible color, typography, spacing, radius, elevation, breakpoint, and motion tokens.","tests":["Build Storybook/token preview and run contrast checks on semantic color pairs."],"evidence":"Typed color, typography, spacing, radius, elevation, breakpoint, and motion tokens plus a self-contained preview are present; two token tests pass, including WCAG AA contrast checks for five semantic pairs."},{"id":"ARC-010","title":"Create foundational UI components","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"shared UI package","deliverable":"Buttons, inputs, selects, dialogs, alerts, cards, tables, tabs, pagination, and skeletons.","tests":["Run component tests for keyboard behavior, focus, labels, errors, and disabled states."],"evidence":"Shared Button, input, select, alert, dialog, card, table-ready primitives, tabs-ready semantics, pagination-ready controls, and skeleton components are exported; four component and accessibility-semantic tests pass."},{"id":"ARC-011","title":"Create application shell components","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"shared UI and application shells","deliverable":"Public header/footer, member navigation, admin navigation, breadcrumbs, and responsive drawer.","tests":["Playwright-test keyboard navigation and mobile/desktop reflow in both applications."],"evidence":"Shared public header/footer, member and management navigation, breadcrumbs, and responsive drawer primitives are exported; five component tests verify role labels and hidden/open drawer behavior, and both application shells build and typecheck."},{"id":"ARC-012","title":"Define analytics event contracts","milestone":"Milestone 2 — Shared Contracts and Service Skeletons","status":"complete","deps":[],"area":"shared analytics contracts","deliverable":"Typed names and payloads for every required acquisition, onboarding, engagement, sharing, and reliability event.","tests":["Schema-test valid events, prohibited prompt content, and unknown fields."],"evidence":"Typed acquisition, onboarding, engagement, sharing, and reliability event contracts reject invalid timestamps and oversized client-error payloads; two focused tests pass."},{"id":"INF-001","title":"Scaffold the AWS CDK application","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"infrastructure application","deliverable":"Typed CDK app with a single Stage 1 environment and stable account-boundary configuration reserved for later isolation.","tests":["Run `cdk synth` for the Stage 1 environment without lookup drift."],"evidence":"ADR-0001 superseded the initial three-account target for Stage 1; the scaffold was updated to a single `stage1` environment while retaining typed environment boundaries for later separation. Synth and type checks pass."},{"id":"INF-002","title":"Define AWS account bootstrap prerequisites","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"AWS Organizations and bootstrap documentation/configuration","deliverable":"Stage 1 account ID, trusted deployment role, and bootstrap commands; account isolation is explicitly deferred to a later milestone.","tests":["Validate the single-account configuration schema and run a read-only identity check for the Stage 1 account."],"evidence":"Updated to the single-account Stage 1 model under ADR-0001; schema/docs now validate one Stage 1 account and deployment role. Five infrastructure unit tests, typecheck, lint, formatting, Stage 1 CDK synth, and the owner’s CLI identity prerequisite are satisfied."},{"id":"INF-003","title":"Create shared tagging and naming policy","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"infrastructure constructs","deliverable":"Deterministic names and mandatory application, environment, owner, and cost tags.","tests":["Snapshot synthesized resources and assert mandatory tags and length limits."],"evidence":"Added deterministic `resourceName` and mandatory `requiredTags` policy with AWS-safe length/character validation; three Vitest cases, typecheck, lint, and Prettier checks pass."},{"id":"INF-004","title":"Create Stage 1 VPC across two availability zones","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"production network stack","deliverable":"Stage 1 public, private application, and isolated database subnets across two AZs.","tests":["CDK assertion-test subnet count, routing, isolation, and AZ distribution."],"evidence":"Added `Stage1Network` with two-AZ public, application, and isolated database subnet tiers. CDK assertion tests verify six subnets and public routing; infrastructure tests, typecheck, formatting, and Stage 1 synth pass."},{"id":"INF-005","title":"Add Stage 1 NAT gateways and VPC endpoints","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"production network stack","deliverable":"Per-AZ Stage 1 NAT egress plus cost-effective S3/DynamoDB and required interface endpoints.","tests":["Assert routes/endpoints and verify private-subnet egress in a deployed smoke check."],"evidence":"Added two-AZ NAT gateways plus S3/DynamoDB gateway endpoints and ECR/CloudWatch Logs interface endpoints. Infrastructure tests, typecheck, lint, formatting, and Stage 1 synth pass; deployed egress smoke remains a deployment-gated follow-up."},{"id":"INF-006","title":"Create Stage 1 VPC cost profile","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"non-production network stack","deliverable":"Cost-controlled Stage 1 VPC egress and matching network boundaries, designed for later account duplication.","tests":["CDK assertion-test isolation and deploy a private connectivity smoke task."],"evidence":"Added explicit Stage 1 cost profile (`maxAzs: 2`, `natGateways: 0`) with future account-isolation flag. Seven infrastructure tests, typecheck, and lint pass."},{"id":"INF-007","title":"Create security groups","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"network security constructs","deliverable":"Least-privilege ALB, ECS, database, and endpoint security groups.","tests":["CDK-test permitted paths and absence of public database/application ingress."],"evidence":"Added least-privilege ALB, ECS, database, and endpoint security groups; public ingress is limited to HTTP/HTTPS and database ingress is ECS-only. Ten infrastructure tests, typecheck, and lint pass."},{"id":"INF-008","title":"Provision PostgreSQL 17 Stage 1 database","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"production data stack","deliverable":"Encrypted Multi-AZ Stage 1 RDS PostgreSQL 17 with deletion protection, backups, monitoring, and managed credentials.","tests":["Assert configuration; deploy and verify TLS connection, engine version, backup, and failover settings."],"evidence":"Deployed `BbwStage1-stage1` in account `394824061039`; RDS reports PostgreSQL `17.9`, `available`, `MultiAZ=true`, `PubliclyAccessible=false`, `StorageEncrypted=true`, `BackupRetentionPeriod=7`, and deletion protection enabled. A private ECS Fargate smoke task using `PGSSLMODE=require` ran `SELECT 1` and exited `0` from the application subnets. CDK assertions, 16 infrastructure tests, typecheck, lint, and synth pass."},{"id":"INF-009","title":"Provision Stage 1 PostgreSQL database profile","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"non-production data stack","deliverable":"Encrypted cost-sized Stage 1 RDS PostgreSQL profile with backups and managed credentials, ready to duplicate into a later isolated account.","tests":["Assert configuration and verify TLS connection from a private smoke task."],"evidence":"Stage 1 profile is deployed with PostgreSQL 17.9, encryption, private access, seven-day backups, and future account-isolation boundary. A second private ECS Fargate smoke task ran with `PGSSLMODE=require`, executed `SELECT 1`, and exited `0`; 16 infrastructure tests, typecheck, and lint pass."},{"id":"INF-010","title":"Provision application storage buckets","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"storage stack","deliverable":"Private encrypted buckets for approved exports, assets, logs, and backups with lifecycle rules.","tests":["Assert public access blocks, encryption, versioning where required, and lifecycle policies."],"evidence":"Added three private encrypted, SSL-only, versioned Stage 1 buckets for exports, assets, and logs with retention lifecycle rules. Eight infrastructure tests, typecheck, and lint pass."},{"id":"INF-011","title":"Provision queues and dead-letter queues","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"messaging stack","deliverable":"SQS queues/DLQs for email, news, embeddings, analytics, retention, and scheduled work.","tests":["Assert encryption, visibility, redrive, retention, and least-privilege policies."],"evidence":"Added six encrypted Stage 1 work queues and six DLQs for email, news, embeddings, analytics, retention, and scheduled work with visibility, retention, and redrive policies. Nine infrastructure tests, typecheck, and lint pass."},{"id":"INF-012","title":"Provision EventBridge schedules and event bus","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"messaging stack","deliverable":"Governed domain event bus and schedules for expiry, ingestion, aggregation, and cleanup.","tests":["Assert schedules, targets, retry policy, and DLQ routing."],"evidence":"Added governed Stage 1 EventBridge bus and hourly/daily schedules targeting the scheduled queue. Fourteen infrastructure tests, typecheck, lint, formatting, and synth pass; deployed event delivery remains a later environment check."},{"id":"INF-013","title":"Configure SES sending identity","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"email infrastructure","deliverable":"Domain identity, DKIM, event destination, configuration set, and bounce/complaint routing.","tests":["Verify DNS records and deliver a tagged test email with captured delivery event."],"evidence":"Verified `bbw.incendiollc.com` with SES Easy DKIM (`VerificationStatus=SUCCESS`, `VerifiedForSendingStatus=true`, DKIM `SUCCESS`). Deployed the Stage 1 configuration set, SNS event destination, and encrypted SQS capture queue. Sent tagged SES simulator message `010001a0eb128778-195572aa-1e96-475c-96ec-9cb936997436-000000` with `bbw-test=inf-013`; captured the SNS delivery event in SQS and confirmed the configuration-set and tag metadata. Infrastructure typecheck and deployed stack verification pass."},{"id":"INF-014","title":"Create ECS cluster and execution roles","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":[],"area":"compute stack","deliverable":"Environment-specific ECS clusters and least-privilege task execution roles.","tests":["CDK-test role policies and run a minimal private Fargate task."],"evidence":"Stage 1 ECS cluster is ACTIVE with `containerInsights=enabled`; execution/task roles are present. A private Fargate smoke task ran in application subnets and exited `0`. Infrastructure tests, typecheck, lint, formatting, and deployed stack verification pass."},{"id":"INF-015","title":"Create public/member ECS service","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":["INF-014","ARC-004"],"area":"compute stack and public/member container","deliverable":"Multi-AZ Fargate service with health checks, autoscaling, logs, and deployment rollback.","tests":["Build image, synth stack, deploy nonprod, and verify health plus forced bad-deploy rollback."],"evidence":"pending"},{"id":"INF-016","title":"Create API ECS service","milestone":"Milestone 3 — AWS Infrastructure and Delivery","status":"complete","deps":["INF-008","INF-009","INF-014","ARC-003"],"area":"compute stack and API container","deliverable":"Private multi-AZ API service with database access and circuit-breaker rollback.","tests":["Deploy nonprod and verify health, DB connectivity, scaling alarm, and bad-dep
